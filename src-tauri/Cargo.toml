[package]
name = "termtorrent"
version = "0.1.0"
description = "Lightweight torrent downloader with a terminal-styled UI"
authors = ["Yayang Setya Nugroho"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "termtorrent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "termtorrent"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "termtorrent-cli"
path = "src/bin/cli.rs"

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [], optional = true }

[dependencies]
tauri = { version = "2.11.5", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7.2", optional = true }
tauri-plugin-opener = { version = "2.5.4", optional = true }
# rustls rather than native TLS: openssl-sys cannot cross-compile to Android
# without a target sysroot, and avoiding it also frees the Linux packages from
# a system libssl dependency.
librqbit = { version = "8.1.1", default-features = false, features = ["rust-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "signal"] }
anyhow = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
