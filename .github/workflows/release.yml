name: release

# Desktop and Android artifacts are built on native runners — Tauri cannot be
# cross-compiled from one host to the others (Linux needs system webkit2gtk,
# Windows needs MSVC + WebView2, Android needs the NDK).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - label: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - label: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - uses: actions/checkout@v4

      # Ubuntu 22.04 rather than latest: it links against an older glibc, so
      # the .deb and AppImage still install on long-term-support distros.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: termtorrent ${{ github.ref_name }}
          releaseBody: "Built from ${{ github.sha }}. See the assets below for your platform."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Android (APK)
    runs-on: ubuntu-22.04
    # The desktop job creates the GitHub Release; wait for it so the upload
    # below has something to attach to.
    needs: desktop
    # Job-level so the signing step's `if:` can see whether a keystore exists —
    # a step cannot read env vars it declares itself.
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # gen/android is generated rather than committed — it is entirely
      # derived from tauri.conf.json and would only rot in the repo.
      - name: Scaffold the Android project
        run: npx tauri android init

      - name: Build debug APK
        run: npx tauri android build --debug --apk

      - name: Build unsigned release APK
        run: npx tauri android build --apk

      # Signing happens here rather than through Gradle so the generated
      # project needs no patching. Skipped entirely when no keystore is set.
      - name: Sign release APK
        if: env.ANDROID_KEYSTORE != ''
        run: |
          set -euo pipefail
          UNSIGNED="$(find src-tauri/gen/android -name '*release-unsigned.apk' | head -1)"
          if [ -z "$UNSIGNED" ]; then
            echo "no unsigned release APK found" >&2
            exit 1
          fi
          APK_DIR="$(dirname "$UNSIGNED")"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"

          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$APK_DIR/termtorrent-release-signed.apk" \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/keystore.jks" "$RUNNER_TEMP/aligned.apk"

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find src-tauri/gen/android -name "*.apk" -path "*outputs*" -exec cp {} artifacts/ \;
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: artifacts/*.apk

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" artifacts/*.apk --clobber
