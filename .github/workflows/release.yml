name: release

# Desktop and Android artifacts are built on native runners — Tauri cannot be
# cross-compiled from one host to the others (Linux needs system webkit2gtk,
# Windows needs MSVC + WebView2, Android needs the NDK).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - label: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - label: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - uses: actions/checkout@v4

      # Ubuntu 22.04 rather than latest: it links against an older glibc, so
      # the .deb and AppImage still install on long-term-support distros.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: termtorrent ${{ github.ref_name }}
          releaseBody: "Built from ${{ github.sha }}. See the assets below for your platform."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Android (APK)
    runs-on: ubuntu-22.04
    # The desktop job creates the GitHub Release; wait for it so the upload
    # below has something to attach to.
    needs: desktop
    # Job-level so the signing step's `if:` can see whether a keystore exists —
    # a step cannot read env vars it declares itself.
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # gen/android is generated rather than committed — it is entirely
      # derived from tauri.conf.json and would only rot in the repo.
      - name: Scaffold the Android project
        run: npx tauri android init

      # Only the release APK is built. A debug build carries unstripped Rust
      # symbols for all four ABIs and lands around 940 MB — too large to be a
      # useful download.
      - name: Build release APK
        run: npx tauri android build --apk

      # Android refuses to install an unsigned APK, so this always signs:
      # with the real keystore when the secrets exist, otherwise with a
      # throwaway key so the artifact is still installable for testing.
      # Signing here rather than via Gradle keeps the generated project unpatched.
      - name: Sign APK
        run: |
          set -euo pipefail
          UNSIGNED="$(find src-tauri/gen/android -name '*release-unsigned.apk' | head -1)"
          if [ -z "$UNSIGNED" ]; then
            echo "no release APK produced" >&2
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          KS="$RUNNER_TEMP/ks.jks"
          VERSION="${GITHUB_REF_NAME#v}"

          if [ -n "${ANDROID_KEYSTORE:-}" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$KS"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
            SUFFIX="release"
          else
            echo "::notice::No ANDROID_KEYSTORE secret — signing with a throwaway CI key."
            KS_PASS="termtorrent"
            KEY_ALIAS="ci"
            KEY_PASS="termtorrent"
            SUFFIX="unofficial"
            keytool -genkeypair -noprompt \
              -keystore "$KS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=termtorrent CI, O=termtorrent, C=ID"
          fi

          mkdir -p artifacts
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KS" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out "artifacts/termtorrent_${VERSION}_universal-${SUFFIX}.apk" \
            "$RUNNER_TEMP/aligned.apk"

          rm -f "$KS" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs \
            "artifacts/termtorrent_${VERSION}_universal-${SUFFIX}.apk"
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: artifacts/*.apk

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" artifacts/*.apk --clobber
